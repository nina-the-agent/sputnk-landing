server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Proxy statuts live → Uptime Kuma (même origine, évite le CORS).
    # 10.0.40.151 = hôte CT 101, port publié du conteneur uptime-kuma (3001).
    location /kuma-api/ {
        proxy_pass http://10.0.40.151:3001/api/;
        proxy_set_header Host status.sputnk.net;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
